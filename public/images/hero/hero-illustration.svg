<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700">
  <defs>
    <linearGradient id="wallOld" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="wallNew" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E08A61"/>
      <stop offset="100%" stop-color="#C15F3C"/>
    </linearGradient>
    <clipPath id="canvasClip">
      <rect x="0" y="0" width="900" height="700" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#canvasClip)">
    <rect width="900" height="700" fill="#F8FAFC"/>

    <!-- old, unpainted wall -->
    <rect x="0" y="0" width="900" height="700" fill="url(#wallOld)"/>

    <!-- freshly painted section, angled edge -->
    <path d="M0,0 L560,0 L360,700 L0,700 Z" fill="url(#wallNew)"/>

    <!-- roller streaks texture on painted side -->
    <g opacity="0.14" stroke="#fff" stroke-width="10" stroke-linecap="round">
      <line x1="60" y1="40" x2="20" y2="640"/>
      <line x1="160" y1="30" x2="110" y2="650"/>
      <line x1="260" y1="20" x2="200" y2="660"/>
      <line x1="360" y1="10" x2="300" y2="670"/>
      <line x1="460" y1="5" x2="400" y2="680"/>
    </g>

    <!-- baseboard line -->
    <rect x="0" y="640" width="900" height="60" fill="#0f172a" opacity="0.06"/>

    <!-- paint drips along the angled edge -->
    <g fill="#C15F3C">
      <path d="M556 90 q10 22 0 34 q-10 -12 0 -34 Z"/>
      <path d="M487 260 q9 26 0 40 q-9 -14 0 -40 Z"/>
      <path d="M424 430 q9 24 0 38 q-9 -14 0 -38 Z"/>
    </g>

    <!-- ladder -->
    <g transform="translate(650,150) rotate(8)">
      <line x1="0" y1="0" x2="-40" y2="380" stroke="#334155" stroke-width="14" stroke-linecap="round"/>
      <line x1="80" y1="0" x2="40" y2="380" stroke="#334155" stroke-width="14" stroke-linecap="round"/>
      <line x1="-14" y1="60" x2="66" y2="60" stroke="#334155" stroke-width="10"/>
      <line x1="-9" y1="150" x2="61" y2="150" stroke="#334155" stroke-width="10"/>
      <line x1="-4" y1="240" x2="56" y2="240" stroke="#334155" stroke-width="10"/>
      <line x1="1" y1="330" x2="51" y2="330" stroke="#334155" stroke-width="10"/>
    </g>

    <!-- paint roller (large, foreground, diagonal) -->
    <g transform="translate(430,330) rotate(-38)">
      <rect x="-18" y="-150" width="36" height="150" rx="8" fill="#7c5b46"/>
      <rect x="-24" y="-170" width="48" height="26" rx="6" fill="#475569"/>
      <rect x="-46" y="-30" width="92" height="60" rx="14" fill="#e2e8f0"/>
      <rect x="-46" y="-30" width="92" height="60" rx="14" fill="#ffffff" opacity="0.4"/>
    </g>

    <!-- insulation roll, leaning right side -->
    <g transform="translate(760,470) rotate(12)">
      <rect x="-30" y="-160" width="60" height="220" rx="30" fill="#fef3c7"/>
      <ellipse cx="0" cy="-160" rx="30" ry="14" fill="#fde68a"/>
      <g stroke="#eab308" stroke-width="4" opacity="0.6">
        <line x1="-24" y1="-140" x2="24" y2="-140"/>
        <line x1="-24" y1="-110" x2="24" y2="-110"/>
        <line x1="-24" y1="-80" x2="24" y2="-80"/>
        <line x1="-24" y1="-50" x2="24" y2="-50"/>
        <line x1="-24" y1="-20" x2="24" y2="-20"/>
      </g>
    </g>

    <!-- paint bucket -->
    <g transform="translate(140,560)">
      <path d="M-45,-10 L45,-10 L35,70 L-35,70 Z" fill="#334155"/>
      <ellipse cx="0" cy="-10" rx="45" ry="12" fill="#1e293b"/>
      <ellipse cx="0" cy="-14" rx="34" ry="8" fill="#C15F3C"/>
      <path d="M-38,-18 Q0,-64 38,-18" stroke="#1e293b" stroke-width="8" fill="none" stroke-linecap="round"/>
    </g>
  </g>
</svg>
